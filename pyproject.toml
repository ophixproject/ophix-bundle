[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-bundle"
version = "2026.05.03.01"
description = "Bundle packages from a local PyPI server for air-gap deployment"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["pypi", "air-gap", "bundle", "packaging"]

authors = [
    {name = "Paul McGowan", email = "maintainer@imagodataflow.com"}
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = []

[project.scripts]
ophix-bundle = "ophix_bundle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
